<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2 Capital | Education</title>
  <meta name="description" content="K2 Capital education: our TILES stock analysis framework and learning resources linking accounting and finance.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site" id="site-header"></header>

  <div class="hero">
    <div class="wrap">
      <h1>Education</h1>
      <p>Our TILES guide to student money, and resources for learning to read the accounting and the finance together.</p>
    </div>
  </div>

  <main class="wrap">
    <section class="block first">
      <h2>TILES: student money essentials</h2>
      <p class="lead" id="tiles-intro"></p>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="block">
      <h2>Resources</h2>
      <div class="controls"><div id="res-chips"></div></div>
      <div class="resources" id="resources"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="site.js"></script>
  <script>
    // ---- Edit this section to update the page (on GitHub: open this file, click the pencil icon) ----

    const TILES_INTRO = "TILES is our five-part guide to student money: Taxes, Investing, Legal, Earning and Savings. Each one comes with a quick fact worth knowing.";

    // fact: a "Did you know" line. Edit the text below, or add/remove tiles, on GitHub.
    const TILES = [
      { letter: "T", title: "Taxes", body: "Income Tax and Benefits Return (T1).",
        stat: "25-35% of Canadian students do not file their T1.",
        fact: "You can file and claim $600-700 every year even with $0 in income." },
      { letter: "I", title: "Investing", body: "Day trading, fundamental valuation and fixed income instruments.",
        stat: "After the U.S. tariff announcement, the U.S. stock market lost nearly $9.5 trillion in value.",
        fact: "You can earn an annualized return of 2.6% by purchasing a 364-day Treasury bill." },
      { letter: "L", title: "Legal", body: "Understand mortgages and the legal steps to register a company.",
        stat: "Nearly 19% of startups collapse due to avoidable legal problems, yet a basic incorporation filing costs just $300.",
        fact: "Registering a trademark for just $478 can protect your brand from lawsuits that often cost far over $50,000 to fight." },
      { letter: "E", title: "Earning", body: "Explore ways to earn through side hustles and scholarships.",
        stat: "Over $4 billion worth of scholarships are awarded to Canadian post-secondary students each year.",
        fact: "About 50% of Canadian students work while studying, earning through jobs or side hustles." },
      { letter: "S", title: "Savings", body: "TFSA, RESP, RRSP and FHSA.",
        stat: "About 99% of Canadians have a bank account, but only about 50% have a TFSA.",
        fact: "The FHSA lets first-time home buyers contribute up to $8,000 a year ($40,000 total) with tax-free growth and withdrawals for your first home." },
    ];

    // category: "Accounting", "Finance" or "Valuation" (add your own). link is optional.
    const RESOURCES = [
      // { category: "Accounting", title: "Reading a 10-K", description: "How to find the numbers that matter.", link: "https://..." },
    ];

    // ---- End of editable section ----

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const $ = (id) => document.getElementById(id);

    $("tiles-intro").textContent = TILES_INTRO;
    $("tiles").innerHTML = TILES.map((t) => `<div class="tile"><div class="letter">${esc(t.letter)}</div><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p>${t.stat ? `<p class="fact">${esc(t.stat)}</p>` : ""}${t.fact ? `<p class="fact"><b>Did you know?</b> ${esc(t.fact)}</p>` : ""}</div>`).join("");

    let cat = "All";
    function renderResources() {
      const cats = ["All", ...new Set(RESOURCES.map((r) => r.category).filter(Boolean))];
      $("res-chips").innerHTML = RESOURCES.length ? cats.map((c) => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join(" ") : "";
      $("res-chips").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { cat = b.dataset.c; renderResources(); }));
      const list = RESOURCES.filter((r) => cat === "All" || r.category === cat);
      $("resources").innerHTML = list.length ? list.map((r) => `<div class="card resource">
          <div class="tags"><span class="tag">${esc(r.category || "Resource")}</span></div>
          <h3>${esc(r.title)}</h3><p>${esc(r.description)}</p>
          ${r.link ? `<a href="${esc(r.link)}" rel="noopener">Open &rarr;</a>` : ""}</div>`).join("")
        : `<div class="empty">Learning resources are coming soon.</div>`;
    }
    renderResources();
  </script>
</body>
</html>
